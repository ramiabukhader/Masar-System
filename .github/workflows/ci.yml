# Runs on every push: tests and a production build.
#
# Vercel builds the app but does not run the test suite, so this is what actually
# catches a broken commit — ideally before the deploy that ships it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # masar-demo.html is a tracked build artifact, and the README tells the reader to
      # double-click it. Nothing regenerated it for six commits, so it went on shipping a
      # whole screen that a later commit had deliberately deleted. Compare the rebuilt
      # file against the committed one, the way a lockfile check works, so it cannot
      # drift again.
      - name: masar-demo.html is in sync with src
        run: |
          node scripts/build-standalone.mjs
          if ! git diff --quiet -- masar-demo.html; then
            echo "::error file=masar-demo.html::Stale standalone build. Run 'npm run build:standalone' and commit the result."
            git diff --stat -- masar-demo.html
            exit 1
          fi
