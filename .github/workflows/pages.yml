# Publishes the Masar demo to GitHub Pages — the live demo linked from the README.
#
# There is no API key, no secret and no third-party account involved. The job
# authenticates with the GITHUB_TOKEN that Actions mints for this run: it is
# scoped to THIS repository, it expires when the job ends, and the permissions
# block below is the entire grant. Nothing outside this repo is reachable, so
# there is nothing to leak and nothing to revoke later.
name: Publish demo to GitHub Pages

# Every push to main redeploys, so the README link never goes stale. It can
# also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight older one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A red test must never reach the live demo.
      - run: npm test

      - run: npm run build

      # Pages has to be switched on once by hand — Settings → Pages → Source:
      # GitHub Actions. The job's token cannot do it (the create-site endpoint
      # needs administration rights), and until it is done this step fails
      # with "Not Found".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
