# Deploys the Masar demo to Cloudflare Pages on every push.
#
# Needs two GitHub repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token scoped to "Cloudflare Pages: Edit" and nothing else
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
#
# The token never appears in the repository or in the build output. It is only
# readable by Actions, and a token scoped to Pages cannot touch DNS, other zones,
# or anything else on the account.
name: Deploy demo

on:
  push:
    branches:
      - main
      - claude/delivery-automation-optimization-9m8mrh
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-flight older one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pushes to main become the production deployment on the custom domain.
          # Any other branch gets its own preview URL and leaves production alone.
          command: pages deploy dist --project-name=masar-demo --branch=${{ github.ref_name }}
