e address is matched against the locality gazetteer (governorate → city → locality). Low confidence sends the order to the human confirmation queue."},guard:{ar:"العنوان غير المؤكد لا يصل إلى الشاحنة أبداً. تخمين الموقع يعني رحلة ضائعة كاملة.",en:"An unresolved address never reaches a truck. Guessing the location means one entirely wasted trip."}},{role:{ar:"المالية / المبيعات",en:"Finance / Sales"},title:{ar:"تأكيد جاهزية الدفع أو التقسيط",en:"Confirm payment or instalment file is complete"},desc:{ar:"طلبات التقسيط البنكي لا تُجدول قبل اكتمال الأوراق، مع بقاء ساعة الالتزام تعمل وإشعار المبيعات.",en:"Bank instalment orders are not scheduled until the paperwork is complete. The SLA clock keeps running and sales is notified."},guard:{ar:"الطاقم لا يستطيع تسليم البضاعة بدون أوراق مكتملة — الرحلة تضيع بالكامل.",en:"The crew cannot release the goods without complete paperwork — the whole trip is wasted."}},{role:{ar:"مخطط التوصيل",en:"Delivery Planner"},title:{ar:"تحديد مصدر البضاعة ونقطة التحميل",en:"Source the stock and pick the loading point"},desc:{ar:"يُفضّل مصدر واحد لكل طلب. إذا احتاج نقلاً بين الفروع، تُنشأ رحلة نقل ليلية ويُسجَّل وقت الجاهزية كقيد على الموعد.",en:"One source per order wherever possible. Where a transfer is needed, an overnight leg is created and its arrival time becomes a release constraint on the delivery."}},{role:{ar:"مخطط التوصيل",en:"Delivery Planner"},title:{ar:"تشغيل موجة التخطيط — الساعة ١٦:٠٠",en:"Run the planning wave — 16:00"},desc:{ar:"كل الطلبات المستحقة خلال الأفق، من كل نقاط الانطلاق، تدخل تحسيناً واحداً: مسارات، تسلسل محطات، نوافذ وصول، وترتيب تحميل.",en:"Every order due within the horizon, from every origin, enters one optimisation: routes, stop sequences, arrival windows and loading order."},guard:{ar:"الدمج يتم حسب جغرافيا التسليم، لا حسب الفرع البائع. هنا يختفي ازدواج الكيلومترات.",en:"Consolidation is by delivery geography, not by selling branch. This is where duplicated kilometres disappear."}},{role:{ar:"النظام + مركز الاتصال",en:"System + call centre"},title:{ar:"تأكيد نافذة الوصول قبل يوم",en:"Confirm the arrival window the day before"},desc:{ar:"رسالة نصية أو واتساب بنافذة من ٣ ساعات ورابط لإعادة الجدولة بضغطة واحدة. من لا يرد يُتَّصل به.",en:"SMS or WhatsApp with a three-hour window and a one-tap reschedule link. Non-responders get a call."},guard:{ar:"هذه الخطوة وحدها هي أكبر توفير في البرنامج — لأنها تمنع المحاولة الفاشلة الأولى.",en:"This single step is the largest saving in the programme, because it prevents the failed first attempt."}},{role:{ar:"النقل الليلي",en:"Overnight shuttle"},title:{ar:"نقل البضاعة إلى نقاط التجميع",en:"Move stock to the corridor staging points"},desc:{ar:"تصل الشحنات المنقولة قبل بداية الدوام لتكون على الرصيف عند وصول الطواقم.",en:"Transferred shipments land before shift start so they are on the dock when the crews arrive."}},{role:{ar:"مشرف الفرع / المستودع",en:"Branch / DC supervisor"},title:{ar:"التجهيز والتحضير على الرصيف",en:"Pick and stage on the dock"},desc:{ar:"التجهيز من قائمة واحدة لكل رحلة، وتُرصف الشحنات بترتيب التحميل قبل فتح باب الشاحنة.",en:"Pick from one list per route, and lay the shipments out in loading order before the truck door opens."}},{role:{ar:"العامل + السائق",en:"Loader + driver"},title:{ar:"التحميل بترتيب معكوس مع المسح الضوئي",en:"Load in reverse delivery order, scan-verified"},desc:{ar:"آخر محطة تُحمّل أولاً. الثقيل والقابل للرصف على الأرضية، والقابل للكسر على الرف العلوي دائماً.",en:"The last stop loads first. Heavy and stackable on the floor; fragile always on the top shelf."},guard:{ar:"بدون هذا الترتيب يُفرّغ الطاقم نصف الشاحنة عند كل محطة — وهنا يقع معظم التلف وضياع الوقت.",en:"Without this order the crew unloads half the truck at every stop — which is where most of the damage and lost time come from."}},{role:{ar:"السائق",en:"Driver"},title:{ar:"فحص ما قبل الانطلاق",en:"Departure check"},desc:{ar:"تطابق عدد القطع مع البيان، أدوات التركيب على متن المركبة، الهاتف مشحون والبيان محمّل للعمل بلا اتصال.",en:"Piece count matches the manifest, installation tools are on board, phone charged and manifest downloaded for offline use."}},{role:{ar:"السائق",en:"Driver"},title:{ar:"الانتقال واتباع تسلسل المحطات",en:"Drive the planned sequence"},desc:{ar:"التسلسل محسوب على أوقات انتقال تتغير حسب الساعة. تغييره يدوياً يُفقد النوافذ المؤكدة للزبائن.",en:"The sequence is computed against travel times that change by hour. Changing it by hand breaks the windows already promised to customers."},guard:{ar:"أي تأخير غير متوقع يُبلَّغ من التطبيق فوراً — غرفة التحكم تعيد الحساب وتبلّغ الزبائن التاليين.",en:"Report any unexpected delay from the app immediately — the Control Tower re-computes and notifies the customers further down the route."}},{role:{ar:"السائق",en:"Driver"},title:{ar:"اتصال ما قبل الوصول",en:"Pre-arrival call"},desc:{ar:"اتصل قبل ١٥–٢٠ دقيقة. تأكد أن الزبون موجود وأن الطريق للمدخل سالك.",en:"Call 15–20 minutes ahead. Confirm the customer is there and the path to the entrance is clear."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"الوصول وفحص المدخل",en:"Arrive and check the access"},desc:{ar:"قِس المدخل والدرج قبل رفع الجهاز. إن كان لا يمر، وثّق بالصور وأبلغ فوراً قبل أي محاولة.",en:"Measure the doorway and stairs before lifting. If it will not fit, photograph it and report immediately — before attempting anything."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"الإنزال والفحص أمام الزبون",en:"Unload and inspect with the customer"},desc:{ar:"افتح التغليف وافحص الجهاز بحضور الزبون. أي تلف يُوثَّق الآن — لا بعد المغادرة.",en:"Open the packaging and inspect the item with the customer present. Any damage is documented now, not after you leave."},guard:{ar:"سياسة الشركة تمنح الزبون ٢٤ ساعة للإبلاغ عن التلف (ونفس اليوم للقابل للكسر). التوثيق عند الباب يحسم النزاع قبل أن يبدأ.",en:"Company policy gives the customer 24 hours to report damage (same day for fragile items). Documenting at the door settles the dispute before it starts."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"التوضيع والتركيب",en:"Position and install"},desc:{ar:"ضع الجهاز في مكانه النهائي، ثم نفّذ التركيب: ماء، غاز، كهرباء، أو تثبيت على الجدار — حسب صلاحيات الطاقم.",en:"Place the appliance in its final position, then complete the installation: water, gas, electrical or wall-mount — within the crew’s certification."},guard:{ar:"لا يُنفَّذ تركيب غاز إلا من طاقم معتمد. النظام لا يُسند هذه الطلبات لغير المؤهلين أصلاً.",en:"Gas work is done only by a certified crew. The system will not assign those jobs to anyone else in the first place."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"التشغيل والاختبار أمام الزبون",en:"Run the functional test with the customer"},desc:{ar:"شغّل الجهاز واعرض عمله. هذا وعد معلن من الشركة، وليس خطوة اختيارية.",en:"Power it up and demonstrate that it works. This is a promise the company advertises, not an optional step."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"إثبات التسليم",en:"Capture proof of delivery"},desc:{ar:"صور للجهاز في مكانه، تأكيد نجاح الاختبار، واسم وتوقيع المستلم.",en:"Photos of the item in place, confirmation the test passed, and the receiver’s name and signature."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"تحصيل المبلغ وتسجيله",en:"Collect and record the payment"},desc:{ar:"سجّل المبلغ في التطبيق فور استلامه. تُطابق المبالغ لكل سائق في نهاية اليوم.",en:"Record the amount in the app the moment you take it. Totals are reconciled per driver at end of day."}},{role:{ar:"الطاقم",en:"Crew"},title:{ar:"رفع التغليف والمخلفات",en:"Remove packaging and waste"},desc:{ar:"خذ التغليف معك ما لم يطلب الزبون الاحتفاظ به — مع تذكيره بأن سياسة الاسترجاع تتطلب حفظ التغليف.",en:"Take the packaging unless the customer asks to keep it — reminding them the returns policy requires the packaging to be retained."}},{role:{ar:"الطاقم ← غرفة التحكم",en:"Crew → Control Tower"},title:{ar:"التعامل مع الاستثناءات",en:"Handle the exception"},desc:{ar:"اختر رمز السبب من التطبيق: الزبون غير موجود، لا يمر من المدخل، تلف، دفع غير جاهز، رفض، طريق مغلق. لا تكتب ملاحظة حرة فقط.",en:"Pick the reason code in the app: customer absent, does not fit, damaged, payment not ready, refused, route blocked. Never a free-text note alone."},guard:{ar:"رموز الأسباب هي ما يجعل المشكلة قابلة للقياس والإصلاح. الملاحظات الحرة تختفي ولا تُصلح شيئاً.",en:"Reason codes are what make a problem measurable and fixable. Free-text notes vanish and fix nothing."}},{role:{ar:"السائق + المالية",en:"Driver + Finance"},title:{ar:"العودة والتسوية المالية",en:"Return to base and reconcile"},desc:{ar:"أعد المرتجعات، سلّم المبالغ المحصّلة، وطابقها مع سجل التطبيق لكل سائق لكل يوم.",en:"Return any refused goods, hand over collected cash, and reconcile it against the app record per driver per day."}},{role:{ar:"النظام",en:"System"},title:{ar:"الإغلاق وقياس الكلفة",en:"Close out and cost the day"},desc:{ar:"تُكتب حالة التسليم في نظامهم، وتُحسب كلفة كل توصيلة، ونسبة النجاح من المحاولة الأولى، والالتزام بالمدة، وتعبئة المركبات.",en:"Delivery status is written back to their system, and cost per drop, first-attempt success, SLA attainment and vehicle fill are computed."},guard:{ar:'ما لا يُقاس لا يتحسّن. هذه الأرقام هي ما يحوّل "نشعر أن العمل غير منظم" إلى رقم ينخفض كل شهر.',en:'What is not measured does not improve. These numbers are what turn "we feel unorganised" into a number that goes down every month.'}}];function cp({t:e,lang:n}){return i.jsx("div",{className:"grid",children:i.jsxs("div",{className:"panel",children:[i.jsxs("div",{className:"panel-head",children:[i.jsx("h2",{children:e("navProcess")}),i.jsxs("span",{className:"sub",children:[Is.length," ",n==="ar"?"خطوة":"steps"]})]}),i.jsxs("div",{className:"panel-body",children:[i.jsx("p",{className:"hint",children:n==="ar"?"من لحظة البيع في المعرض حتى وصول الشحنة إلى باب الزبون في المدينة المستهدفة، وتسوية المبالغ وقياس الكلفة. كل خطوة لها مسؤول، وكل تحذير يمنع خسارة محددة.":"From the sale on the showroom floor to the shipment at the customer’s door in the target city, the cash reconciled and the cost measured. Every step has an owner; every guard prevents a specific, named loss."}),i.jsx("div",{className:"flow",children:Is.map((t,r)=>i.jsxs("div",{className:"flow-step",children:[i.jsxs("div",{className:"flow-rail",children:[i.jsx("div",{className:"flow-num",children:r+1}),r<Is.length-1&&i.jsx("div",{className:"flow-line"})]}),i.jsxs("div",{className:"flow-content",children:[i.jsx("div",{className:"flow-role",children:t.role[n]}),i.jsx("div",{className:"flow-title",children:t.title[n]}),i.jsx("p",{className:"flow-desc",children:t.desc[n]}),t.guard&&i.jsx("div",{className:"flow-guard",children:t.guard[n]})]})]},r))})]})]})})}const Ko=[{id:"phase-0",labelAr:"المرحلة صفر · النموذج",labelEn:"Phase 0 · Prototype",timingAr:"مكتملة",timingEn:"Complete",goalAr:"إثبات أن المشكلة قابلة للحل، وبناء نسخة تجريبية تُعرض على مسلماني هوم.",goalEn:"Prove the problem is solvable, and build a demo to show Maslamani Home.",outcomeAr:"محرك تخطيط حقيقي يعمل، وتطبيق ويب عربي بالكامل، ودليل عمليات من البداية إلى النهاية.",outcomeEn:"A working planning engine, a fully Arabic web application, and end-to-end process manuals.",status:"done",items:[{titleAr:"بحث وتحليل الوضع الحالي",titleEn:"Research and current-state analysis",status:"done"},{titleAr:"نموذج البيانات وعقد التكامل مع قاعدة بياناتهم",titleEn:"Data model and DB integration contract",status:"done"},{titleAr:"محرك تحسين المسارات مع كل القيود الصارمة",titleEn:"Route optimiser with every hard constraint",status:"done"},{titleAr:"لوحة الطلبات وغرفة التحكم وعمليات الفرع",titleEn:"Orders board, Control Tower, Branch Ops",status:"done"},{titleAr:"تطبيق السائق ومتابعة مراحل الطلب",titleEn:"Driver app and order milestone tracking",status:"done"},{titleAr:"إجراءات العمل بالعربية والإنجليزية",titleEn:"Standard operating procedures, Arabic and English",status:"done"}]},{id:"phase-1",labelAr:"المرحلة الأولى · نرى",labelEn:"Phase 1 · See it",timingAr:"الأسابيع ١–٤",timingEn:"Weeks 1–4",goalAr:"ربط النظام بقاعدة بياناتهم للقراءة فقط، وقياس خط الأساس الحقيقي. لا يتغير شيء في ط
