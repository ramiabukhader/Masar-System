e:{ar:"تأكيد جاهزية الدفع أو التقسيط",en:"Confirm payment or instalment file is complete"},desc:{ar:"طلبات التقسيط البنكي لا تُجدول قبل اكتمال الأوراق، مع بقاء ساعة الالتزام تعمل وإشعار المبيعات.",en:"Bank instalment orders are not scheduled until the paperwork is complete. The SLA clock keeps running and sales is notified."},guard:{ar:"الطاقم لا يستطيع تسليم البضاعة بدون أوراق مكتملة — الرحلة تضيع بالكامل.",en:"The crew cannot release the goods without complete paperwork — the whole trip is wasted."}},{role:{ar:"مخطط التوصيل",en:"Delivery Planner"},title:{ar:"تحديد مصدر البضاعة ونقطة التحميل",en:"Source the stock and pick the loading point"},desc:{ar:"يُفضّل مصدر واحد لكل طلب. إذا احتاج نقلاً بين الفروع، تُنشأ رحلة نقل ليلية ويُسجَّل وقت الجاهزية كقيد على الموعد.",en:"One source per order wherever possible. Where a transfer is needed, an overnight leg is created and its arrival time becomes a release constraint on the delivery."}},{role:{ar:"مخطط التوصيل",en:"Delivery Planner"},title:{ar:"تشغيل موجة التخطيط — الساعة ١٦:٠٠",en:"Run the planning wave — 16:00"},desc:{ar:"كل الطلبات المستحقة خلال الأفق، من كل نقاط الانطلاق، تدخل تحسيناً واحداً: مسارات، تسلسل محطات، نوافذ وصول، وترتيب تحميل.",en:"Every order due within the horizon, from every origin, enters one optimisation: routes, stop sequences, arrival windows and loading order."},guard:{ar:"الدمج يتم حسب جغرافيا التسليم، لا حسب الفرع البائع. هنا يختفي ازدواج الكيلومترات.",en:"Consolidation is by delivery geography, not by selling branch. This is where duplicated kilometres disappear."}},{role:{ar:"النظام + مركز الاتصال",en:"System + call centre"},title:{ar:"تأكيد نافذة الوصول قبل يوم",en:"Confirm the arrival window the day before"},desc:{ar:"رسالة نصية أو واتساب بنافذة من ٣ ساعات ورابط لإعادة الجدولة بضغطة واحدة. من لا يرد يُتَّصل به.",en:"SMS or WhatsApp with a three-hour window and a one-tap reschedule link. Non-responders get a call."},guard:{ar:"هذه الخطوة وحدها هي أكبر توفير في البرنامج — لأنها تمنع المحاولة الفاشلة الأولى.",en:"This single step is the largest saving in the programme, because it prevents the failed first attempt."}},{role:{ar:"النقل الليلي",en:"Overnight shuttle"},title:{ar:"نقل البضاعة إلى نقاط التجميع",en:"Move stock to the corridor staging points"},desc:{ar:"تصل الشحنات المنقولة قبل بداية الدوام لتكون على الرصيف عند وصول الطواقم.",en:"Transferred shipments land before shift start so they are on the dock when the crews arrive."}},{role:{ar:"مشرف الفرع / المستودع",en:"Branch / DC supervisor"},title:{ar:"التجهيز والتحضير على الرصيف",en:"Pick and stage on the dock"},desc:{ar:"التجهيز من قائمة واحدة لكل رحلة، وتُرصف الشحنات بترتيب التحميل قبل فتح باب الشاحنة.",en:"Pick from one list per route, and lay the shipments out in loading order before the truck door opens."}},{role:{ar:"العامل + السائق",en:"Loader + driver"},title:{ar:"التحميل بترتيب معكوس مع المسح الضوئي",en:"Load in reverse delivery order, scan-verified"},desc:{ar:"آخر محطة تُحمّل أولاً. الثقيل والقابل للرصف على الأرضية، والقابل للكسر على الرف العلوي دائماً.",en:"The last stop loads first. Heavy and stackable on the floor; fragile always on the top shelf."},guard:{ar:"بدون هذا الترتيب يُفرّغ الطاقم نصف الشاحنة عند كل محطة — وهنا يقع معظم التلف وضياع الوقت.",en:"Without this order the crew unloads half the truck at every stop — which is where most of the damage and lost time come from."}},{role:{ar:"السائق",en:"Driver"},title:{ar:"فحص ما قبل الانطلاق",en:"Departure check"},desc:{ar:"تطابق عدد القطع مع البيان، أدوات التركيب على متن المركبة، الهاتف مشحون والبيان محمّل للعمل بلا اتصال.",en:"Piece count matches the manifest, installation tools are on board, phone charged and manifest downloaded for offline use."}},{role:{ar:"السائق",en:"Driver"},title:{ar:"الانتقال واتباع تسلسل المحطات",en:"Drive the planned sequence"},desc:{ar:"التسلسل محسوب على أوقات انتقال تتغير حسب الساعة. تغييره يدوياً يُفقد النوافذ المؤكدة للزبائن.",en:"The sequence is computed against travel times that change by hour. Changing
