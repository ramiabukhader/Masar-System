<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Keeps the demo out of search results while it is unreleased client work.
      This is discoverability control, not access control — see the hosting
      section of the README for the difference.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Stamped here rather than only from React so the first paint is already on the
      right ground — otherwise the page flashes the wrong colour before mounting.
    -->
    <meta name="theme-color" content="#fdfbf9" />
    <style>
      html { background: #fdfbf9; color-scheme: light; }
      html[data-theme='dark'] { background: #232120; color-scheme: dark; }
    </style>
    <title>مسار — نظام إدارة وتحسين التوصيل | Masar Delivery Platform</title>
    <!--
      Tajawal (UI) and IBM Plex Mono (digits) are served from this app, not from a
      CDN: a branch PC may be offline or behind a restrictive network, and the app
      has to look the same either way. Split by unicode-range, so only the subsets
      a page actually paints get downloaded.
    -->
    <link rel="stylesheet" href="./fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
