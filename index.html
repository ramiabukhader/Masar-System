<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Keeps the demo out of search results while it is unreleased client work.
      This is discoverability control, not access control — see the hosting
      section of the README for the difference.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>مسار — نظام إدارة وتحسين التوصيل | Masar Delivery Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-blocking. This app is meant to run on a branch PC that may be offline or
      behind a restrictive network; a webfont stylesheet must never hold up first paint.
      Without it the app falls back to the system Arabic and monospace faces.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
